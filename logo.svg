<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="440" height="90">
  <defs>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  
  <!-- Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Hexagon/Shield Container -->
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#0f172a" />
    
    <!-- Snowflake cooling rays -->
    <path d="M 23 20 L 23 38 M 15 28 L 31 28 M 17 22 L 29 34 M 17 34 L 29 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Warm flame / spark accent -->
    <path d="M 45 48 C 42 42 48 36 47 30 C 53 34 57 40 55 48 C 54 53 49 56 45 54 C 42 52 41 48 45 48 Z" fill="url(#warmGrad)" />
    
    <!-- Bold A1 lettermark in emblem -->
    <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">A1</text>
  </g>
  
  <!-- Brand Text -->
  <text x="95" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#0f172a" letter-spacing="-0.5">A1 A/C <tspan fill="#f97316">SERVICE</tspan></text>
  <text x="96" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="3.5">HEATING &amp; COOLING SPECIALISTS</text>
</svg>